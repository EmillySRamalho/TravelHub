<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard TravelHub</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="profile-section">
            <img id="user-photo" src="img/default-avatar.png" alt="Foto do usuário">
            <input type="file" id="photo-input" accept="image/*" hidden>
            <button id="change-photo-btn"><i class="fa fa-camera"></i></button>
            <h2 id="user-name">Usuário</h2>
        </div>
        <nav class="menu">
            <button id="home-btn"><i class="fa fa-home"></i> Início</button>
            <button id="dashboard-btn"><i class="fa fa-chart-bar"></i> Dashboard</button>
            <button id="reservas-btn"><i class="fa fa-plane"></i> Minhas Reservas</button>
            <button id="pagamento-btn"><i class="fa fa-credit-card"></i> Pagamentos</button>
            <button id="logout-btn"><i class="fa fa-sign-out-alt"></i> Sair</button>
        </nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Bem-vindo, <span id="user-name-header">Usuário</span>!</h1>
        </header>
        <div id="content-area" class="content">
            <p>Selecione uma opção no menu para visualizar detalhes.</p>
        </div>
    </main>
</div>
<script type="module" src="dashboard-completo.js"></script>
</body>
</html>
